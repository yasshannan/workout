  <script>
    // The colours chosen in Settings, before anything is drawn (app.js keeps this copy up to date).
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- The intro: the logo draws itself, then the app appears. Once per start of the app. -->
  <div id="intro" aria-hidden="true">
    <svg class="intro-logo" viewBox="-40 -40 1645 1573">
      <path class="intro-fill" fill-rule="evenodd" d="M1565 1493H0L553 0H1012ZM489 1202H1073L783 350Z"/>
      <path class="intro-line" pathLength="1" d="M553 0H1012L1565 1493H0Z"/>
      <path class="intro-line inner" pathLength="1" d="M783 350L1073 1202H489Z"/>
    </svg>
    <div class="intro-name">Training</div>
    <div class="intro-version">Version 1.1</div>
  </div>
  <script>
    (function () {
      const intro = document.getElementById('intro');
      const done = () => intro.remove();
      let seen = false;
      try { seen = sessionStorage.getItem('introSeen') === '1'; sessionStorage.setItem('introSeen', '1'); } catch (e) {}
      if (seen || matchMedia('(prefers-reduced-motion: reduce)').matches) { done(); return; }
      intro.addEventListener('animationend', (event) => { if (event.target === intro) done(); });
      intro.addEventListener('click', () => intro.classList.add('skip'));     // a tap skips it
      setTimeout(done, 3000);                                                  // in case no animation runs
    })();
  </script>

  <!-- Every screen is drawn into this element by js/app.js -->
  <main id="screen"></main>

  <!-- Bottom tab bar (hidden while a workout is on screen) -->
  <nav id="tabbar" hidden>
